name: Deploy via FTP (reusable)

# Reusable workflow: builds the frontend (static files) and the backend
# (one static Go binary) and uploads both to an FTP/FTPS server.
#
# Configure these in the GitHub Environment (staging / production):
#
# Secrets (frontend and backend can live on different FTP servers/accounts):
#   FTP_FRONTEND_HOST       FTP host for the frontend (e.g. ftp.example.com)
#   FTP_FRONTEND_USERNAME   FTP user for the frontend
#   FTP_FRONTEND_PASSWORD   FTP password for the frontend
#   FTP_BACKEND_HOST        FTP host for the backend binary
#   FTP_BACKEND_USERNAME    FTP user for the backend binary
#   FTP_BACKEND_PASSWORD    FTP password for the backend binary
#   VITE_API_URL            (optional) backend API URL baked into the frontend build
#
# Settings (Settings → Environments → Variables, or as Secrets — both work):
#   FTP_FRONTEND_DIR          remote dir for the frontend, e.g. /public_html
#   FTP_BACKEND_DIR           remote dir for the backend binary, e.g. /backend
#   FTP_FRONTEND_PORT         (optional) default 21
#   FTP_BACKEND_PORT          (optional) default 21
#   FTP_FRONTEND_VERIFY_CERT  (optional) "false" = do not verify the FTPS TLS certificate
#   FTP_BACKEND_VERIFY_CERT   (optional) "false" = do not verify the FTPS TLS certificate
#   FTP_FRONTEND_DELETE       (optional) "true" = delete remote files missing from the build
#   BACKEND_BINARY_NAME       (optional) default api-server
#   BACKEND_GOARCH            (optional) amd64 | arm64, default amd64
#   VITE_API_URL              (optional) used if the secret of the same name is empty

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment holding the FTP settings
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      FTP_FRONTEND_HOST: ${{ secrets.FTP_FRONTEND_HOST }}
      FTP_FRONTEND_USERNAME: ${{ secrets.FTP_FRONTEND_USERNAME }}
      FTP_FRONTEND_PASSWORD: ${{ secrets.FTP_FRONTEND_PASSWORD }}
      FTP_FRONTEND_PORT: ${{ vars.FTP_FRONTEND_PORT || secrets.FTP_FRONTEND_PORT || '21' }}
      FTP_FRONTEND_DIR: ${{ vars.FTP_FRONTEND_DIR || secrets.FTP_FRONTEND_DIR }}
      FTP_FRONTEND_VERIFY_CERT: ${{ vars.FTP_FRONTEND_VERIFY_CERT || secrets.FTP_FRONTEND_VERIFY_CERT || 'true' }}
      FTP_FRONTEND_DELETE: ${{ vars.FTP_FRONTEND_DELETE || secrets.FTP_FRONTEND_DELETE || 'false' }}
      FTP_BACKEND_HOST: ${{ secrets.FTP_BACKEND_HOST }}
      FTP_BACKEND_USERNAME: ${{ secrets.FTP_BACKEND_USERNAME }}
      FTP_BACKEND_PASSWORD: ${{ secrets.FTP_BACKEND_PASSWORD }}
      FTP_BACKEND_PORT: ${{ vars.FTP_BACKEND_PORT || secrets.FTP_BACKEND_PORT || '21' }}
      FTP_BACKEND_DIR: ${{ vars.FTP_BACKEND_DIR || secrets.FTP_BACKEND_DIR }}
      FTP_BACKEND_VERIFY_CERT: ${{ vars.FTP_BACKEND_VERIFY_CERT || secrets.FTP_BACKEND_VERIFY_CERT || 'true' }}
      BINARY_NAME: ${{ vars.BACKEND_BINARY_NAME || secrets.BACKEND_BINARY_NAME || 'api-server' }}
    steps:
      - uses: actions/checkout@v7

      - name: Check FTP configuration
        run: |
          missing=0
          for v in FTP_FRONTEND_HOST FTP_FRONTEND_USERNAME FTP_FRONTEND_PASSWORD FTP_FRONTEND_DIR \
                   FTP_BACKEND_HOST FTP_BACKEND_USERNAME FTP_BACKEND_PASSWORD FTP_BACKEND_DIR; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is empty. Add it as a Variable or Secret of the '${{ inputs.environment }}' environment (or of the repository), with exactly this name."
              missing=1
            fi
          done
          exit $missing

      # ---------- Frontend ----------
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Build frontend
        working-directory: ./registro-frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || vars.VITE_API_URL }}
        run: |
          if [ -n "$VITE_API_URL" ]; then
            echo "VITE_API_URL=$VITE_API_URL" > .env.production
          else
            echo "::warning::VITE_API_URL is not set, using the build default"
          fi
          npm ci
          npm run build
          test -f dist/index.html

      # ---------- Backend ----------
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: registro-backend/go.mod
          cache-dependency-path: registro-backend/go.sum

      - name: Build backend binary
        working-directory: ./registro-backend
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ vars.BACKEND_GOARCH || secrets.BACKEND_GOARCH || 'amd64' }}
        run: |
          mkdir -p ../deploy-backend
          go build -trimpath \
            -ldflags "-s -w -X registro-backend/pkg/version.GitCommit=$(git rev-parse --short HEAD) -X registro-backend/pkg/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "../deploy-backend/$BINARY_NAME" ./cmd/api-server
          ls -lh "../deploy-backend/$BINARY_NAME"

      # ---------- Upload ----------
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload frontend via FTP
        run: |
          delete_flag=""
          if [ "$FTP_FRONTEND_DELETE" = "true" ]; then delete_flag="--delete"; fi
          # Assets first, index.html last, so visitors never get an index.html
          # that points to files not uploaded yet.
          lftp -u "$FTP_FRONTEND_USERNAME","$FTP_FRONTEND_PASSWORD" -p "$FTP_FRONTEND_PORT" "$FTP_FRONTEND_HOST" <<EOF
          set cmd:fail-exit yes
          set net:max-retries 3
          set ssl:verify-certificate $FTP_FRONTEND_VERIFY_CERT
          mkdir -p -f "$FTP_FRONTEND_DIR"
          mirror -R --no-perms --verbose --parallel=4 $delete_flag --exclude-glob index.html registro-frontend/dist/ "$FTP_FRONTEND_DIR"
          put -O "$FTP_FRONTEND_DIR" registro-frontend/dist/index.html
          bye
          EOF

      - name: Upload backend binary via FTP
        run: |
          # Upload under a temporary name, then swap it in, so the running
          # process is not left with a half-written file.
          lftp -u "$FTP_BACKEND_USERNAME","$FTP_BACKEND_PASSWORD" -p "$FTP_BACKEND_PORT" "$FTP_BACKEND_HOST" <<EOF
          set cmd:fail-exit yes
          set net:max-retries 3
          set ssl:verify-certificate $FTP_BACKEND_VERIFY_CERT
          mkdir -p -f "$FTP_BACKEND_DIR"
          cd "$FTP_BACKEND_DIR"
          put "deploy-backend/$BINARY_NAME" -o "$BINARY_NAME.new"
          rm -f "$BINARY_NAME"
          mv "$BINARY_NAME.new" "$BINARY_NAME"
          bye
          EOF
          # Not every FTP server supports SITE CHMOD: warn instead of failing.
          # The binary is a new file on every deploy, so without chmod it is
          # not executable: run "chmod +x" on the server before starting it
          # (e.g. ExecStartPre=/bin/chmod +x ... in the systemd unit).
          lftp -u "$FTP_BACKEND_USERNAME","$FTP_BACKEND_PASSWORD" -p "$FTP_BACKEND_PORT" "$FTP_BACKEND_HOST" \
            -e "set ssl:verify-certificate $FTP_BACKEND_VERIFY_CERT; chmod 755 \"$FTP_BACKEND_DIR/$BINARY_NAME\"; bye" \
            || echo "::warning::This FTP server does not allow chmod: run 'chmod +x $FTP_BACKEND_DIR/$BINARY_NAME' on the server before starting the backend"

      - name: Summary
        run: |
          {
            echo "### FTP deploy (${{ inputs.environment }})"
            echo "- Frontend → \`$FTP_FRONTEND_DIR\`"
            echo "- Backend binary → \`$FTP_BACKEND_DIR/$BINARY_NAME\`"
            echo ""
            echo "Restart the backend service on the server to run the new binary."
          } >> "$GITHUB_STEP_SUMMARY"
